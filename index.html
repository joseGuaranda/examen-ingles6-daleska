<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examen de Inglés 6</title><style>
:root{--bg:#fff0f6;--card:#ffffff;--ink:#4a1f3a;--mut:#8a5a76;--pink:#ec4899;--pink2:#f9a8d4;--soft:#fce7f3;--ok:#16a34a;--ko:#dc2626;--line:#f5c6dd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
header{text-align:center;padding:10px 0 6px}
header h1{margin:0;font-size:clamp(1.5rem,5vw,2.1rem);color:var(--pink)}
header p{margin:4px 0 0;color:var(--mut)}
.bar{position:sticky;top:0;z-index:20;margin:12px -16px 14px;padding:10px 16px;background:rgba(255,240,246,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog{font-weight:600;color:var(--mut)}
.prog b{color:var(--pink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
#verify{background:var(--pink);color:#fff;box-shadow:0 3px 0 #be185d}
#verify:active{transform:translateY(2px);box-shadow:0 1px 0 #be185d}
#retry{background:var(--soft);color:var(--pink);border:2px solid var(--pink2)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;margin:0 0 14px;box-shadow:0 2px 10px rgba(236,72,153,.08)}
.qcard.good{border-color:var(--ok);background:#f4fdf7}
.qcard.bad{border-color:var(--ko);background:#fff6f6}
.img-wrap{position:relative;width:100%}
.img-wrap img{display:block;width:100%;height:auto;border-radius:8px}
.cb{position:absolute;transform:translate(-50%,-50%);display:block;cursor:pointer;border-radius:50%;aspect-ratio:1;-webkit-tap-highlight-color:transparent}
.cb input{position:absolute;inset:14%;width:72%;height:72%;margin:0;appearance:none;-webkit-appearance:none;border-radius:50%;border:2px solid transparent;background:transparent;cursor:pointer;outline:0}
.cb input:checked{background:radial-gradient(circle,var(--pink) 0 42%,#fff 46% 100%);border-color:var(--pink)}
.cb:hover input:not(:checked){background:rgba(236,72,153,.18)}
.cb input:focus-visible{outline:2px solid var(--pink);outline-offset:1px}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.25);aspect-ratio:1;pointer-events:none;display:none}
.revealed .ring{display:block}
.pts{display:inline-block;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--pink);border-radius:999px;padding:2px 10px;margin:6px 4px 0}
.res{display:none;margin:6px 4px 2px;font-weight:700}
.revealed .res{display:block}
.good .res{color:var(--ok)}.bad .res{color:var(--ko)}
#score{display:none;text-align:center;background:var(--card);border:2px solid var(--pink2);border-radius:16px;padding:16px;margin:0 0 14px}
#score.show{display:block}
#score .big{font-size:2.2rem;font-weight:800;color:var(--pink)}
#key{display:none;background:var(--card);border:2px dashed var(--pink2);border-radius:16px;padding:14px}
#key.show{display:block}
#key h2{margin:0 0 8px;font-size:1.1rem;color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:.92rem}
.chip b{color:var(--pink)}
@media (max-width:480px){.btns{width:100%}.btns button{flex:1}}
</style></head><body><div class="wrap">
<header><h1>Examen de Inglés</h1><p>Daleska · marca una respuesta en cada pregunta</p></header>
<div class="bar"><div class="prog">Respondidas: <b id="n">0</b> / 8</div><div class="btns"><button id="verify">Verificar respuestas</button><button id="retry">Intentar de nuevo</button></div></div>
<div id="qs"></div>
<div id="score"><div>Tu puntaje</div><div class="big"><span id="pts">0</span> / 10</div><div><span id="ok">0</span> de 8 correctas</div><div id="msg"></div></div>
<div id="key"><h2>Respuestas correctas</h2><div class="chips" id="chips"></div></div>
</div><script>
const Q=[{"id": 1, "img": "q1.png", "W": 1312, "H": 478, "pts": 1, "correct": 2, "s": 1.89, "opts": [{"l": "1", "x": 2.1, "y": 17.26}, {"l": "2", "x": 2.1, "y": 23.01}, {"l": "3", "x": 2.1, "y": 28.77}, {"l": "4", "x": 2.1, "y": 34.41}], "key": "It is a ball."}, {"id": 2, "img": "q2.png", "W": 1314, "H": 588, "pts": 1.5, "correct": 2, "s": 1.93, "opts": [{"l": "1", "x": 2.09, "y": 17.77}, {"l": "2", "x": 2.09, "y": 22.45}, {"l": "3", "x": 2.09, "y": 27.13}, {"l": "4", "x": 2.09, "y": 31.89}], "key": "I'm three years old."}, {"id": 3, "img": "q3.png", "W": 1310, "H": 382, "pts": 1, "correct": 1, "s": 1.83, "opts": [{"l": "1", "x": 15.42, "y": 42.54}, {"l": "2", "x": 15.42, "y": 49.35}], "key": "Small"}, {"id": 4, "img": "q4.png", "W": 1307, "H": 349, "pts": 1, "correct": 4, "s": 1.9, "opts": [{"l": "1", "x": 1.95, "y": 25.64}, {"l": "2", "x": 1.95, "y": 33.52}, {"l": "3", "x": 1.95, "y": 41.4}, {"l": "4", "x": 1.95, "y": 49.14}, {"l": "5", "x": 1.95, "y": 57.16}], "key": "Black"}, {"id": 5, "img": "q5.png", "W": 1308, "H": 265, "pts": 1.5, "correct": 3, "s": 1.9, "opts": [{"l": "1", "x": 2.03, "y": 35.09}, {"l": "2", "x": 2.03, "y": 45.47}, {"l": "3", "x": 2.03, "y": 55.66}, {"l": "4", "x": 2.03, "y": 65.85}], "key": "5 rectangles"}, {"id": 6, "img": "q6.png", "W": 1312, "H": 483, "pts": 1, "correct": 2, "s": 1.89, "opts": [{"l": "1", "x": 2.02, "y": 18.94}, {"l": "2", "x": 2.02, "y": 24.53}, {"l": "3", "x": 2.02, "y": 30.33}, {"l": "4", "x": 2.02, "y": 35.92}], "key": "It is a teddy bear."}, {"id": 7, "img": "q7.png", "W": 1314, "H": 237, "pts": 1.5, "correct": 3, "s": 1.89, "opts": [{"l": "1", "x": 2.17, "y": 38.61}, {"l": "2", "x": 2.17, "y": 50.0}, {"l": "3", "x": 2.17, "y": 61.39}, {"l": "4", "x": 2.17, "y": 73.21}, {"l": "5", "x": 2.17, "y": 84.6}], "key": "It is a green helicopter."}, {"id": 8, "img": "q8.png", "W": 1308, "H": 386, "pts": 1.5, "correct": 1, "s": 1.9, "opts": [{"l": "1", "x": 17.01, "y": 43.91}, {"l": "2", "x": 17.01, "y": 50.91}], "key": "No, it isn't."}];
const sel={};
const $=s=>document.querySelector(s);
const total=Q.reduce((a,q)=>a+q.pts,0);
const L=q=>q.opts[q.correct].l;
function build(){
  const box=$('#qs');box.innerHTML='';
  Q.forEach(q=>{
    const c=document.createElement('section');c.className='qcard';c.id='c'+q.id;
    let h='<div class="img-wrap"><img src="'+q.img+'" alt="Pregunta '+q.id+'" width="'+q.W+'" height="'+q.H+'">';
    q.opts.forEach((o,i)=>{
      h+='<label class="cb" style="left:'+o.x+'%;top:'+o.y+'%;width:'+q.s+'%" aria-label="Pregunta '+q.id+', opción '+o.l+'"><input type="radio" name="q'+q.id+'" value="'+i+'"></label>';
    });
    const o=q.opts[q.correct];
    h+='<span class="ring" style="left:'+o.x+'%;top:'+o.y+'%;width:'+(q.s*1.13)+'%"></span></div>';
    h+='<div class="res" id="r'+q.id+'"></div>';
    c.innerHTML=h;box.appendChild(c);
  });
  box.addEventListener('change',e=>{
    if(e.target.matches('input')){sel[e.target.name.slice(1)]=+e.target.value;upd();}
  });
  const k=$('#chips');k.innerHTML=Q.map(q=>'<span class="chip"><b>'+q.id+'.</b> '+q.key+'</span>').join('');
  upd();
}
function upd(){$('#n').textContent=Object.keys(sel).length;}
let done=false;
function verify(){
  if(done)return;
  const miss=Q.filter(q=>sel[q.id]===undefined).length;
  if(miss&&!confirm('Te faltan '+miss+' pregunta(s) por responder. ¿Verificar de todas formas?'))return;
  done=true;let pts=0,ok=0;
  Q.forEach(q=>{
    const c=$('#c'+q.id),r=$('#r'+q.id),good=sel[q.id]===q.correct;
    c.classList.add('revealed',good?'good':'bad');
    if(good){pts+=q.pts;ok++;r.textContent='✔ Correcta (+'+q.pts+')';}
    else r.textContent=(sel[q.id]===undefined?'✘ Sin responder':'✘ Incorrecta')+' — la correcta es: '+q.key;
  });
  $('#pts').textContent=pts;$('#ok').textContent=ok;
  const m=pts===total?'¡Perfecto, Daleska! 🌟':pts>=total*.7?'¡Muy bien! 💖':'¡Sigue practicando, tú puedes! 🌸';
  $('#msg').textContent=m;
  $('#score').classList.add('show');$('#key').classList.add('show');
  $('#score').scrollIntoView({behavior:'smooth',block:'center'});
}
function retry(){
  done=false;for(const k in sel)delete sel[k];
  $('#score').classList.remove('show');$('#key').classList.remove('show');
  build();window.scrollTo({top:0,behavior:'smooth'});
}
$('#verify').onclick=verify;$('#retry').onclick=retry;
build();
</script></body></html>
